  <rect x="650" y="338" width="260" height="68" fill="#161B22" rx="10" stroke="#1E2229" stroke-width="1.5"/>
  <text x="780" y="380" font-family="monospace" font-size="24" fill="#00E676" text-anchor="middle">✓ Uptime 24h</text>

  <!-- Feature pills row 2 -->
  <rect x="230" y="422" width="260" height="68" fill="#161B22" rx="10" stroke="#1E2229" stroke-width="1.5"/>
  <text x="360" y="464" font-family="monospace" font-size="24" fill="#00E676" text-anchor="middle">✓ Watchlist</text>

  <rect x="510" y="422" width="260" height="68" fill="#161B22" rx="10" stroke="#1E2229" stroke-width="1.5"/>
  <text x="640" y="464" font-family="monospace" font-size="24" fill="#00E676" text-anchor="middle">✓ Nostr Login</text>

